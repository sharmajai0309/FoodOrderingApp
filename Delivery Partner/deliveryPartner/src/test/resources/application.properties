spring.application.name=deliveryPartner
server.port = 8082




# Database configuration for tests (using main PostgreSQL instance)
spring.datasource.url=jdbc:postgresql://localhost:5433/delivery_partner_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Exclude MongoDB and Kafka auto-configurations to isolate JPA tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration, \
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration, \
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration


# MONGODB
spring.data.mongodb.uri=mongodb://localhost:27017/delivery_partner_events_db

# KAFKA
spring.kafka.bootstrap-servers=localhost:9092

# ACTUATOR
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


